schema_version: 3
# Host security posture. SELinux Enforcing and AppArmor Enabled are the two
# top causes of "process started but cannot bind/write/exec" tickets, so
# both are gated as failures rather than informational. Firewall daemons get
# an active/inactive posture report AND — per selected product — a rule audit
# of the ports that product needs. The audit is backend-agnostic (it inspects
# whichever of firewalld / iptables / nftables is active) and product-gated,
# so a Workbench host is only judged on 8787, a Connect host on 3939, etc.
checks:
  - id: sec.selinux.not-enforcing
    title: SELinux is not Enforcing
    short_description: Checking SELinux is not in Enforcing mode
    category: Security
    tags: [selinux, security]
    applies_to:
      os: [rhel-8, rhel-9, rhel-10]
    why: |
      SELinux in Enforcing mode is the most common cause of post-install
      "the service started but the port won't bind / the socket won't open
       / the file won't write" tickets on RHEL-family hosts. There is no
      bundled Posit policy module, so an enforcing host needs a custom
      module or `setsebool` adjustments before Workbench / Connect / PPM
      will run cleanly. Permissive and Disabled both PASS.
    remediation: |
      Either set SELinux to Permissive (`sudo setenforce 0` and edit
      /etc/selinux/config), or author a custom policy module that allows
      the Posit binaries to bind their listen ports and write to their
      data directories. Posit-published example policy modules are linked
      in the troubleshooting article below.
    references:
      - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/using_selinux/
      - https://support.posit.co/hc/en-us/sections/360008902394-Security
    primitive: selinux
    with:
      expect: not_enforcing

  - id: sec.apparmor.not-enabled
    title: AppArmor is not enabled
    short_description: Checking AppArmor is not enabled
    category: Security
    tags: [apparmor, security]
    applies_to:
      os: [ubuntu-22.04, ubuntu-24.04]
    why: |
      AppArmor on Ubuntu confines binaries to their declared paths. There
      is no bundled Posit profile, so an enabled AppArmor will produce
      EACCES from rsession spawning under /tmp, from rstudio-connect's
      content sandbox, and from rstudio-pm's repository writes. Disabled
      and absent both PASS.
    remediation: |
      Either disable AppArmor (`sudo systemctl disable --now apparmor`
      and reboot, or boot with `apparmor=0`), or author a custom AppArmor
      profile in complain mode that allows the Posit binaries to read,
      write, and exec their data directories.
    references:
      - https://ubuntu.com/server/docs/security-apparmor
    primitive: apparmor
    with:
      expect: not_enabled

  - id: sec.firewalld.inactive
    title: firewalld is not active (or rules permit Posit ports)
    short_description: Checking firewalld posture
    category: Security
    tags: [firewall, security]
    applies_to:
      os: [rhel-8, rhel-9, rhel-10]
    why: |
      firewalld is the default RHEL firewall. Reported here only as
      posture; the per-product port audits are the load-bearing checks
      when the daemon is active.
    primitive: systemd
    with:
      unit: firewalld
      expect: inactive
      timeout_seconds: 5

  - id: sec.iptables.inactive
    title: iptables service is not active (or rules permit Posit ports)
    short_description: Checking iptables service posture
    category: Security
    tags: [firewall, security]
    why: |
      Some RHEL deployments still drive iptables directly via the iptables
      systemd service. As with firewalld, pev surfaces whether it is active
      so SEs know to look for rules.
    primitive: systemd
    with:
      unit: iptables
      expect: inactive
      timeout_seconds: 5

  - id: sec.nftables.inactive
    title: nftables service is not active (or rules permit Posit ports)
    short_description: Checking nftables service posture
    category: Security
    tags: [firewall, security]
    why: |
      nftables is the modern Linux firewall front-end. Reported here only
      as posture; the per-product port audits are the load-bearing checks
      when the daemon is active.
    primitive: systemd
    with:
      unit: nftables
      expect: inactive
      timeout_seconds: 5

  - id: sec.firewall.workbench-port
    title: Firewall permits inbound access to Workbench
    short_description: Auditing firewall rules for Workbench access
    category: Security
    tags: [firewall, security, ports, workbench]
    applies_to:
      products: [workbench]
    why: |
      For users to reach Workbench the host firewall must permit inbound
      traffic on either the front-door HTTP(S) ports (80/443) — the normal
      production posture, where a TLS reverse proxy terminates in front of
      Workbench — or, failing that, Workbench's default port 8787. This
      audit inspects whichever firewall backend is active (firewalld,
      iptables, or nftables) and no-ops when none is active.

      PASS: 80 or 443 is open (front door reachable).
      WARN: only 8787 is open — clients hit Workbench directly on its
      default port, which almost always means there is no local TLS/SSL
      termination in front of it. Fine for a quick trial; revisit before
      production.
      FAIL: neither the front door nor 8787 is open — Workbench will be
      unreachable.
    remediation: |
      Open the front-door ports if you terminate TLS at a reverse proxy:
        sudo firewall-cmd --permanent --add-port=443/tcp
        sudo firewall-cmd --permanent --add-port=80/tcp
        sudo firewall-cmd --reload
      Or, to expose Workbench directly (no local TLS), open 8787:
        sudo firewall-cmd --permanent --add-port=8787/tcp && sudo firewall-cmd --reload
      iptables:  sudo iptables -I INPUT -p tcp --dport 443 -j ACCEPT
      nftables:  nft add rule inet filter input tcp dport {80,443} accept
    references:
      - https://docs.posit.co/ide/server-pro/access_and_security/network_port_and_address.html
    primitive: cmd
    with:
      cmd: |
        PORT=8787
        PRODUCT="Workbench"
        # --- shared firewall port resolver (identical across product checks) ---
        # Detect active backends. If none is active, nothing filters inbound
        # traffic and the port question is moot (PASS noop).
        fwd=0; ipt=0; nft=0
        command -v firewall-cmd >/dev/null 2>&1 && systemctl is-active --quiet firewalld 2>/dev/null && fwd=1
        command -v iptables     >/dev/null 2>&1 && systemctl is-active --quiet iptables  2>/dev/null && ipt=1
        command -v nft          >/dev/null 2>&1 && systemctl is-active --quiet nftables  2>/dev/null && nft=1
        if [ "$fwd$ipt$nft" = "000" ]; then
          echo "no active firewall backend; nothing filters inbound $PRODUCT traffic"; exit 0
        fi
        if [ "$fwd" = 1 ]; then
          FWD_PORTS=$(firewall-cmd --list-ports 2>/dev/null)
          # Expand every active *service* to its ports. A port opened via a
          # named service (a custom rstudio.xml, or the builtin http/https
          # services) is carried INSIDE the service definition and never shows
          # up in --list-ports. Without this expansion the port looks blocked
          # and we would emit a false WARN/FAIL.
          FWD_SVC=""
          for svc in $(firewall-cmd --list-services 2>/dev/null); do
            FWD_SVC="$FWD_SVC $(firewall-cmd --info-service="$svc" 2>/dev/null | sed -n 's/^[[:space:]]*ports:[[:space:]]*//p')"
          done
        fi
        [ "$ipt" = 1 ] && IPT=$(iptables -S INPUT 2>/dev/null)
        [ "$nft" = 1 ] && NFT=$(nft -a list ruleset 2>/dev/null)
        # is_open <port>: succeeds only if EVERY active backend permits the port.
        is_open() {
          _p="$1"
          if [ "$fwd" = 1 ]; then
            echo "$FWD_PORTS $FWD_SVC" | grep -qwE "${_p}/tcp" || return 1
          fi
          if [ "$ipt" = 1 ]; then
            if echo "$IPT" | head -1 | grep -q '^-P INPUT ACCEPT' && \
               ! echo "$IPT" | grep -qE '^-A INPUT.*-j (DROP|REJECT)'; then
              : # default-permit
            else
              echo "$IPT" | grep -qE -- "^-A INPUT.* --dport ${_p}\b.* -j ACCEPT" || return 1
            fi
          fi
          if [ "$nft" = 1 ] && [ -n "$NFT" ]; then
            echo "$NFT" | grep -qE "tcp dport (${_p}\b|\{[^}]*\b${_p}\b[^}]*\})[^,]*accept" || return 1
          fi
          return 0
        }
        # --- end shared resolver ---
        if is_open 80 || is_open 443; then
          echo "front-door 80/443 open; $PRODUCT is reachable (typically via a TLS reverse proxy)"; exit 0
        fi
        if is_open "$PORT"; then
          echo "front-door 80/443 blocked, but $PRODUCT default port $PORT is open — clients reach $PRODUCT directly on $PORT, likely without local TLS/SSL termination"; exit 2
        fi
        echo "neither the front-door ports (80/443) nor the $PRODUCT port ($PORT) are permitted by the active firewall — $PRODUCT will be unreachable"; exit 1
      expect_exit: 0
      warn_exit: 2
      timeout_seconds: 10

