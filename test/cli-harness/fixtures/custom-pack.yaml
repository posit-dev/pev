schema_version: 3
# Dummy custom check pack used only by the CLI test harness. It exercises the
# --checks-file load path with a trivially-true file primitive so the harness
# can feed it through `assess` / `lint-checks` without depending on host state.
checks:
  - id: harness.placeholder.tmp-exists
    title: /tmp exists and is a directory
    short_description: Harness placeholder check
    category: Harness
    tags: [harness, placeholder]
    why: |
      Placeholder check authored by the pev CLI test harness. It verifies that
      /tmp is present so the custom-pack load path returns at least one PASS.
    references:
      - https://example.com/pev-harness
    primitive: dir
    with:
      path: /tmp
